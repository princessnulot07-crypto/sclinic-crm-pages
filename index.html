.btn{border:1px solid var(--line);background:white;border-radius:8px;padding:10px 14px;color:var(--ink)}.btn.primary{background:var(--accent2);color:white;border-color:var(--accent2)}.btn:hover{filter:brightness(.97)}.btn.small{padding:7px 10px;font-size:12px}

.panel{padding:18px;margin-bottom:18px}.panelhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:15px}.panelhead h2{font-size:16px;font-weight:600;margin:0}.filters{display:flex;gap:8px;flex-wrap:wrap}.field{border:1px solid var(--line);border-radius:8px;padding:9px 11px;background:white;color:var(--ink);min-width:0}.field.search{min-width:220px}

.empty{text-align:center;padding:35px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.quicklist{display:grid;gap:12px}.quickrow{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid #f0ede8;padding-bottom:10px}.quickrow:last-child{border:0;padding:0}
.modalback{display:none;position:fixed;inset:0;background:#17151288;z-index:20;align-items:center;justify-content:center;padding:16px}.modalback.show{display:flex}.modal{background:white;border-radius:14px;width:min(620px,100%);max-height:90vh;overflow:auto;padding:22px;box-shadow:0 20px 70px #0003}.modal h2{font-size:19px;margin:0 0 18px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.formitem{display:grid;gap:5px}.formitem.full{grid-column:1/-1}.formitem label{font-size:12px;color:var(--muted)}.filters .formitem{min-width:170px}.formitem input,.formitem select,.formitem textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px;background:#fff}.formitem textarea{min-height:75px;resize:vertical}.modalactions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}

.reportgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.reportbox{background:#faf9f7;border-radius:9px;padding:14px}.reportbox strong{font-size:22px;display:block;margin-top:5px}
.mobilemenu{display:none}
/* Lead register organization */
.panelhead{flex-wrap:wrap}.filters{align-items:center}.filters select{max-width:210px}
.tablewrap{border:1px solid var(--line);border-radius:9px}.tablewrap thead th{position:sticky;top:0;background:#faf8f5;z-index:1}

.wr h1{font-size:22px;font-weight:700;margin:0 0 6px}.wr h3{font-size:15px;margin:22px 0 8px}.wmeta{color:#555;margin:0 0 4px}.wnote{font-size:11px;color:#666;margin:8px 0 0}
.wr table{white-space:normal}.wr th{background:#4d4d4f;color:#fff;text-transform:none;letter-spacing:0;font-size:11px;font-weight:600;text-align:center;padding:9px 6px;border-bottom:0}
.wr td{text-align:center;font-weight:600;padding:10px 6px}.wr td:first-child,.wr th:first-child{text-align:left}.wr tbody tr:nth-child(even) td{background:#f1f1f1}.wr tr.yel td{background:#fbf6d5!important}.wr tr.tot td{background:#e6e6e6!important;font-weight:700}
.wl{display:block;font-weight:600;margin:12px 0 5px}.wt{width:100%;min-height:62px;border:1px solid var(--line);border-radius:8px;padding:10px;font:inherit}
@media print{.sidebar,.topbar,.pagehead,.noprint,.mobilemenu{display:none!important}.shell,.main{display:block}.content{padding:0;max-width:none}body{background:#fff}.panel{box-shadow:none;border:0;padding:0}.wt{border:0;border-bottom:1px solid #bbb;border-radius:0;resize:none}.wr th,.wr tr.yel td,.wr tr.tot td,.wr tbody tr:nth-child(even) td{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
.stat.stat-link{cursor:pointer;transition:box-shadow .15s,transform .15s;border-color:#d7c8b8}.stat.stat-link:hover,.stat.stat-link:focus-visible{box-shadow:0 9px 24px #29272322;transform:translateY(-2px);outline:2px solid #9a8065;outline-offset:2px}.stat-link small:after{content:"  →";font-weight:700}.followup-stats .stat[role="button"]{cursor:pointer;transition:border-color .15s,background .15s}.followup-stats .stat[role="button"]:hover,.followup-stats .stat.selected{border-color:var(--accent);background:#faf6f0}.followup-stats .stat[role="button"]:focus-visible{outline:3px solid var(--accent);outline-offset:2px}.followup-filter-note{margin:0 0 14px;color:var(--muted);font-size:12px}
.pill.Called{background:#e9edf8;color:#4c628c}.pill.Called-No-Answer{background:#f7e9e5;color:#9c5b4d}
.pill.Follow-up-Required{background:#f5edda;color:#85662f}.dashboard-date-panel .formitem{min-width:190px}.followup-stats{margin-top:0;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}.lead-date-filter{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px}.lead-date-filter input{max-width:160px}@media(max-width:520px){.lead-date-filter{flex:1}.lead-date-filter input{width:100%;min-width:0}}
 .savewarning{background:#fff2d9;border-bottom:1px solid #e7d3a7;padding:10px 30px;font-size:12px;color:#6a4c22}
#saveBar{background:#f0eae2;border-bottom:1px solid #dfd2c3;padding:10px 30px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:12px}#saveBar .btn{padding:7px 11px}#saveStatus{font-weight:600;color:#6f5944}#saveStatus.error{color:#b85d55}
</style>

<body>
<div class="shell" id="crmShell" style="display:none">
<aside class="sidebar">
 <div class="brand"><strong>S’CLINIC</strong><small>HAIR, BEAUTY, WELLNESS</small></div>
 <nav class="nav">
  <button class="active" data-page="dashboard"><span>⌂</span><span class="navlabel">Dashboard</span></button>
  <button data-page="leads"><span>◎</span><span class="navlabel">All Leads</span></button>
  <button data-page="followups"><span>◷</span><span class="navlabel">Follow-ups</span></button>
  <button data-page="consultations"><span>▣</span><span class="navlabel">Consultations</span></button>
  <button data-page="reports"><span>▤</span><span class="navlabel">Reports</span></button>
  <button data-page="settings"><span>⚙</span><span class="navlabel">Settings</span></button>
 </nav>
 <div class="sidefoot">Private shared CRM workspace<br>Secure cloud edition</div>
</aside>
<main class="main">
 <header class="topbar"><div><div class="eyebrow">S’CLINIC / CLIENT MANAGEMENT</div><strong id="topTitle">Dashboard</strong></div><div class="user"><div class="avatar">S</div><div><strong style="font-size:12px">S’CLINIC Team</strong><span class="sub" id="accountLabel"></span><button class="btn small" onclick="logoutCRM()" type="button">Sign out</button></div></div></header>
 <div id="saveBar"><span id="saveStatus" role="status" aria-live="polite">Connecting to cloud…</span><button class="btn" type="button" onclick="loadCloud()">Refresh leads</button><button class="btn" type="button" onclick="backupJSON()">Download backup</button></div>
  <section class="content" id="app"></section>
</main>
</div>
<div class="modalback" id="leadModal"><div class="modal">
 <h2 id="modalTitle">Add new lead</h2>
 <form id="leadForm"><input type="hidden" id="editId">
 <div class="formgrid">
  <div class="formitem"><label>First name *</label><input id="firstName" required></div>
  <div class="formitem"><label>Last name</label><input id="lastName"></div>
  <div class="formitem"><label>WhatsApp / phone *</label><input id="phone" required placeholder="+971 5X XXX XXXX"></div>
  <div class="formitem"><label>Lead date *</label><input id="leadDateInput" type="date" required></div>
  <div class="formitem"><label>Lead source</label><select id="source"><option>Instagram</option><option>Facebook</option><option>NA</option><option>LinkedIn</option></select></div>
  <div class="formitem"><label>Status</label><select id="status"><option>New</option><option>Called</option><option>Called No Answer</option><option>Interested</option><option>Follow-up Required</option><option>No response</option><option>Booked</option><option>Attended</option><option>No-show</option><option>Converted</option><option>Lost</option></select></div>
  <div class="formitem"><label>Next follow-up</label><input id="followDate" type="date"></div>
  <div class="formitem"><label>Consultation date</label><input id="consultDate" type="date"></div>
  <div class="formitem"><label>Package value (AED)</label><input id="value" type="number" min="0" step="0.01" placeholder="0"></div>
  <div class="formitem full"><label>Notes</label><textarea id="notes" placeholder="Enquiry details, preferences, follow-up notes..."></textarea></div>
 </div><div class="modalactions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" type="submit">Save lead</button></div>
 </form>
 </div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<div id="loginOverlay" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#f7f5f1;z-index:100;padding:20px"><form onsubmit="loginCRM(event)" style="background:white;border:1px solid #e8e3db;border-radius:14px;padding:30px;width:min(420px,100%);box-shadow:0 8px 28px #2927230b"><h2 style="letter-spacing:2px">S’CLINIC</h2><p style="color:#77736c">Secure team CRM sign-in · recovery v3</p><label>Email<input id="loginEmail" type="email" required autocomplete="username" class="field" style="display:block;width:100%;margin:7px 0 15px"></label><label>Password<input id="loginPassword" type="password" required autocomplete="current-password" class="field" style="display:block;width:100%;margin:7px 0 15px"></label><button class="btn primary" id="loginSubmit" type="submit" style="width:100%">Sign in</button><button class="btn" type="button" onclick="resetCRMPassword()" style="width:100%;margin-top:10px">Set / reset password</button><p id="loginMessage" role="status" style="color:#b85d55;font-size:12px"></p></form></div>
<script>
const SUPABASE_URL='https://nidzaresttneurunhjjk.supabase.co';
const SUPABASE_KEY='sb_publishable_4eN38x0JgvkbeYXlVssXbQ_xgHuHcCM';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const recoveryParams = new URLSearchParams(window.location.hash.replace(/^#/,''));
const queryParams = new URLSearchParams(window.location.search);
let passwordRecoveryMode = recoveryParams.get('type') === 'recovery' || queryParams.get('type') === 'recovery';
let recoveryEventSeen = false;

function showPasswordRecovery(){
 passwordRecoveryMode=true;
 document.getElementById('loginOverlay').style.display='flex';
 document.getElementById('crmShell').style.display='none';
 const form=document.querySelector('#loginOverlay form');
 form.onsubmit=saveNewCRMPassword;
 form.querySelector('h2').textContent='Create your new password';
 form.querySelector('p').textContent='Enter a new password to activate your S’CLINIC CRM account.';
 document.getElementById('loginEmail').closest('label').style.display='none';
 const field=document.getElementById('loginPassword');
 field.value='';field.required=true;field.autocomplete='new-password';field.minLength=8;
 field.closest('label').firstChild.textContent='New password';
 document.getElementById('loginSubmit').textContent='Save new password';
 const resetButton=form.querySelector('button[onclick="resetCRMPassword()"]');
 if(resetButton)resetButton.style.display='none';
 document.getElementById('loginMessage').textContent='Use at least 8 characters.';
}
async function saveNewCRMPassword(event){
 event.preventDefault();
 const password=document.getElementById('loginPassword').value;
 if(password.length<8){document.getElementById('loginMessage').textContent='Use at least 8 characters.';return}
 const button=document.getElementById('loginSubmit');button.disabled=true;
 const {error}=await sb.auth.updateUser({password});button.disabled=false;
 if(error){document.getElementById('loginMessage').textContent=error.message;return}
 passwordRecoveryMode=false;
 history.replaceState({},'',window.location.origin+window.location.pathname);
 document.getElementById('loginMessage').textContent='Password saved. Loading your CRM…';
 await setupCloud();
}
sb.auth.onAuthStateChange((event)=>{
 if(event==='PASSWORD_RECOVERY'){
  recoveryEventSeen=true;
  showPasswordRecovery();
}
if(event==='SIGNED_IN' && passwordRecoveryMode)showPasswordRecovery();
});
let leads=[], activeUser=null, cloudReady=false, savePending=false, cloudChannel=null;
const statusEl=()=>document.getElementById('saveStatus');
function saveIndicator(message,error=false){const el=statusEl();if(el){el.textContent=message;el.classList.toggle('error',error)}}
function validBackup(value){return Array.isArray(value)&&value.every(x=>x&&typeof x==='object'&&typeof x.id==='string'&&typeof x.firstName==='string')}
function save(){return cloudReady;}
async function loadCloud(){
 if(!activeUser)return;
 saveIndicator('Loading leads from secure cloud…');
 const rows=[];
 for(let offset=0;;offset+=500){
  const {data,error}=await sb.from('leads').select('id,payload').order('id').range(offset,offset+499);
  if(error){saveIndicator('Could not load leads: '+error.message,true);return}
  rows.push(...data);if(data.length<500)break;
 }
 leads=rows.map(x=>x.payload);cloudReady=true;
 leads=leads.map(x=>({...x,source:normalizeSource(x)}));
 saveIndicator('Cloud connected • '+leads.length+' leads');render();
}
async function saveCloudLead(lead){
 if(!activeUser||!cloudReady)throw Error('Please sign in and load the CRM first');
 saveIndicator('Saving to shared cloud…');
 const {error}=await sb.from('leads').upsert({id:lead.id,payload:lead,updated_by:activeUser.id},{onConflict:'id'});
 if(error){saveIndicator('NOT SAVED: '+error.message,true);throw error}
 saveIndicator('Saved to shared cloud ✓');
}
async function setupCloud(){
 // Allow the Supabase client to finish consuming the recovery URL first.
 const {data:{session}}=await sb.auth.getSession();
 if(passwordRecoveryMode){
  if(session){showPasswordRecovery();return}
  // A missing recovery session means the one-time link was not accepted.
  showLogin('Recovery link could not be verified. Request a new link only after the email limit resets.');
  return;
 }
 const {data:{user},error}=await sb.auth.getUser();
 if(error||!user){showLogin();return}
 const {data:membership,error:memberError}=await sb.from('team_members').select('role').eq('user_id',user.id).maybeSingle();
 if(memberError||!membership){await sb.auth.signOut();showLogin('This email is not authorized for the S’CLINIC CRM.');return}
 activeUser=user;
 document.getElementById('loginOverlay').style.display='none';
 document.getElementById('crmShell').style.display='flex';
 document.getElementById('accountLabel').textContent=user.email+' ('+membership.role+')';
 await loadCloud();
 if(cloudChannel)await sb.removeChannel(cloudChannel);
 cloudChannel=sb.channel('crm-leads-sync').on('postgres_changes',{event:'*',schema:'public',table:'leads'},()=>{if(!savePending)loadCloud()}).subscribe();
 // Fallback refresh covers projects without Realtime publication enabled.
 window.addEventListener('focus',()=>{if(activeUser&&!savePending)loadCloud()});
}
function showLogin(message=''){
 activeUser=null;cloudReady=false;leads=[];
 document.getElementById('crmShell').style.display='none';
 document.getElementById('loginOverlay').style.display='flex';
 document.getElementById('loginMessage').textContent=message;
}
async function loginCRM(e){
 e.preventDefault();const btn=document.getElementById('loginSubmit');btn.disabled=true;
 document.getElementById('loginMessage').textContent='Signing in…';
 const email=document.getElementById('loginEmail').value.trim();
 const password=document.getElementById('loginPassword').value;
 const {error}=await sb.auth.signInWithPassword({email,password});
 btn.disabled=false;
 if(error){document.getElementById('loginMessage').textContent=error.message;return}
 document.getElementById('loginPassword').value='';await setupCloud();
}
async function logoutCRM(){if(cloudChannel)await sb.removeChannel(cloudChannel);cloudChannel=null;await sb.auth.signOut();showLogin('Signed out.');}
async function resetCRMPassword(){const email=document.getElementById('loginEmail').value.trim();if(!email){document.getElementById('loginMessage').textContent='Enter your email first.';return}const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:window.location.origin+window.location.pathname});document.getElementById('loginMessage').textContent=error?error.message:'If this account exists, a password reset email has been sent.'}
let page='dashboard';
const app=document.getElementById('app');
const money=n=>'AED '+Number(n||0).toLocaleString('en-AE',{maximumFractionDigits:2});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Dubai',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
function normalizeSource(x){const original=String(x.source||x.trackerData?.['Lead Source']||'').trim().toLowerCase();const campaign=String(x.trackerData?.Campaign||'').toLowerCase();if(original==='linkedin'||campaign==='linkedin')return 'LinkedIn';if(original==='instagram'||campaign.includes('instagram'))return 'Instagram';if(original==='facebook'||campaign.includes('facebook'))return 'Facebook';return 'NA';}
leads=leads.map(x=>({...x,source:normalizeSource(x)}));
const getDue=()=>leads.filter(x=>x.followDate&&x.followDate<=today()&&!['Converted','Lost'].includes(x.status));
function stats(){return {total:leads.length,new:leads.filter(x=>x.status==='New').length,booked:leads.filter(x=>x.status==='Booked').length,converted:leads.filter(x=>x.status==='Converted').length,revenue:leads.filter(x=>x.status==='Converted').reduce((s,x)=>s+Number(x.value||0),0)}}
function setPage(p){page=p;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}
document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>setPage(b.dataset.page)));
function pageHead(title,desc,action=''){return `<div class="pagehead"><div><h1>${title}</h1><p>${desc}</p></div>${action}</div>`}
function render(){
 document.getElementById('topTitle').textContent=({dashboard:'Dashboard',leads:'All Leads',followups:'Follow-ups',consultations:'Consultations',reports:'Reports',settings:'Settings'})[page];
 if(page==='dashboard')renderDashboard();if(page==='leads')renderLeads();if(page==='followups')renderFollowups();if(page==='consultations')renderConsultations();if(page==='reports')renderReports();if(page==='settings')renderSettings();
}
// Dashboard date range uses the date each lead was received, inclusive of both endpoints.
let dashboardRange={from:'',to:''};
function dashboardFilteredLeads(){
 const from=dashboardRange.from?dateSortValue(dashboardRange.from):0;
 const to=dashboardRange.to?dateSortValue(dashboardRange.to):0;
 return leads.filter(x=>{const d=dateSortValue(leadDate(x));return (!from||(d&&d>=from))&&(!to||(d&&d<=to));});
}
function applyDashboardDates(){
 const from=document.getElementById('dashboardFrom').value,to=document.getElementById('dashboardTo').value;
 if(from&&to&&from>to){alert('From date cannot be later than To date.');return;}
 dashboardRange={from,to};renderDashboard();

function clearDashboardDates(){dashboardRange={from:'',to:''};renderDashboard()}

 (a.followDate?dateSortValue(a.followDate):Number.MAX_SAFE_INTEGER)-(b.followDate?dateSortValue(b.followDate):Number.MAX_SAFE_INTEGER)||

function dateSortValue(value){

 if(typeof value==='number'&&value>20000&&value<80000)return Date.UTC(1899,11,30)+value*86400000;
 const raw=String(value).trim();
 let m=raw.match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})/);
 if(m)return Date.UTC(Number(m[1]),Number(m[2])-1,Number(m[3]));
 m=raw.match(/^(\d{1,2})[/-](\d{1,2})[/-](\d{4})$/);
 if(m)return Date.UTC(Number(m[3]),Number(m[2])-1,Number(m[1]));

function repFlags(x){
