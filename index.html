<body>

 <div id="saveBar"><span id="saveStatus" role="status" aria-live="polite">Connecting to cloud…</span><button class="btn" type="button" onclick="loadCloud()">Refresh leads</button><button class="btn" type="button" onclick="backupJSON()">Download backup</button></div>

 <h2 id="modalTitle">Add new lead</h2>

 </div><div class="modalactions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" type="submit">Save lead</button></div>

 </div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<div id="loginOverlay" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#f7f5f1;z-index:100;padding:20px"><form onsubmit="loginCRM(event)" style="background:white;border:1px solid #e8e3db;border-radius:14px;padding:30px;width:min(420px,100%);box-shadow:0 8px 28px #2927230b"><h2 style="letter-spacing:2px">S’CLINIC</h2><p style="color:#77736c">Secure team CRM sign-in · recovery v3</p><label>Email<input id="loginEmail" type="email" required autocomplete="username" class="field" style="display:block;width:100%;margin:7px 0 15px"></label><label>Password<input id="loginPassword" type="password" required autocomplete="current-password" class="field" style="display:block;width:100%;margin:7px 0 15px"></label><button class="btn primary" id="loginSubmit" type="submit" style="width:100%">Sign in</button><button class="btn" type="button" onclick="resetCRMPassword()" style="width:100%;margin-top:10px">Set / reset password</button><p id="loginMessage" role="status" style="color:#b85d55;font-size:12px"></p></form></div>
<script>
const SUPABASE_URL='https://nidzaresttneurunhjjk.supabase.co';
const SUPABASE_KEY='sb_publishable_4eN38x0JgvkbeYXlVssXbQ_xgHuHcCM';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const recoveryParams = new URLSearchParams(window.location.hash.replace(/^#/,''));
const queryParams = new URLSearchParams(window.location.search);
let passwordRecoveryMode = recoveryParams.get('type') === 'recovery' || queryParams.get('type') === 'recovery';
let recoveryEventSeen = false;

function showPasswordRecovery(){
 passwordRecoveryMode=true;
 document.getElementById('loginOverlay').style.display='flex';
 document.getElementById('crmShell').style.display='none';
 const form=document.querySelector('#loginOverlay form');
 form.onsubmit=saveNewCRMPassword;
 form.querySelector('h2').textContent='Create your new password';
 form.querySelector('p').textContent='Enter a new password to activate your S’CLINIC CRM account.';
 document.getElementById('loginEmail').closest('label').style.display='none';
 const field=document.getElementById('loginPassword');
 field.value='';field.required=true;field.autocomplete='new-password';field.minLength=8;
 field.closest('label').firstChild.textContent='New password';
 document.getElementById('loginSubmit').textContent='Save new password';
 const resetButton=form.querySelector('button[onclick="resetCRMPassword()"]');
 if(resetButton)resetButton.style.display='none';
 document.getElementById('loginMessage').textContent='Use at least 8 characters.';
}
async function saveNewCRMPassword(event){
 event.preventDefault();
 const password=document.getElementById('loginPassword').value;
 if(password.length<8){document.getElementById('loginMessage').textContent='Use at least 8 characters.';return}
 const button=document.getElementById('loginSubmit');button.disabled=true;
 const {error}=await sb.auth.updateUser({password});button.disabled=false;
 if(error){document.getElementById('loginMessage').textContent=error.message;return}
 passwordRecoveryMode=false;
 history.replaceState({},'',window.location.origin+window.location.pathname);
 document.getElementById('loginMessage').textContent='Password saved. Loading your CRM…';
 await setupCloud();
}
sb.auth.onAuthStateChange((event)=>{
 if(event==='PASSWORD_RECOVERY'){
  recoveryEventSeen=true;
  showPasswordRecovery();
}
if(event==='SIGNED_IN' && passwordRecoveryMode)showPasswordRecovery();
});
let leads=[], activeUser=null, cloudReady=false, savePending=false, cloudChannel=null;
const statusEl=()=>document.getElementById('saveStatus');
function saveIndicator(message,error=false){const el=statusEl();if(el){el.textContent=message;el.classList.toggle('error',error)}}
function validBackup(value){return Array.isArray(value)&&value.every(x=>x&&typeof x==='object'&&typeof x.id==='string'&&typeof x.firstName==='string')}
function save(){return cloudReady;}
let cloudLoadInProgress=false;
let cloudRefreshTimer=null;
function scheduleCloudRefresh(){
 clearTimeout(cloudRefreshTimer);
 cloudRefreshTimer=setTimeout(()=>{if(activeUser&&!savePending)loadCloud()},5000);
}
async function loadCloud(){
 if(!activeUser||cloudLoadInProgress)return;
 cloudLoadInProgress=true;
 saveIndicator('Loading leads from secure cloud…');
 const rows=[];
 for(let offset=0;;offset+=500){
  const {data,error}=await sb.from('leads').select('id,payload').order('id').range(offset,offset+499);
  if(error){cloudLoadInProgress=false;saveIndicator('Could not load leads: '+error.message,true);return}
  rows.push(...data);if(data.length<500)break;
 }
 leads=rows.map(x=>x.payload);cloudReady=true;
 leads=leads.map(x=>({...x,source:normalizeSource(x),status:displayLeadStatus(x)}));
 saveIndicator('Cloud connected • '+leads.length+' leads');
 // Keep the search box and selected filters intact during cloud refreshes.
 if(page==='leads'&&document.getElementById('leadTable')&&document.getElementById('search')){
  filterLeads();
 }else render();
 cloudLoadInProgress=false;
}
async function saveCloudLead(lead){
 if(!activeUser||!cloudReady)throw Error('Please sign in and load the CRM first');
 saveIndicator('Saving to shared cloud…');
 const {error}=await sb.from('leads').upsert({id:lead.id,payload:lead,updated_by:activeUser.id},{onConflict:'id'});
 if(error){saveIndicator('NOT SAVED: '+error.message,true);throw error}
 saveIndicator('Saved to shared cloud ✓');
}
async function setupCloud(){
 // Allow the Supabase client to finish consuming the recovery URL first.
 const {data:{session}}=await sb.auth.getSession();
 if(passwordRecoveryMode){
  if(session){showPasswordRecovery();return}
  // A missing recovery session means the one-time link was not accepted.
  showLogin('Recovery link could not be verified. Request a new link only after the email limit resets.');
  return;
 }
 const {data:{user},error}=await sb.auth.getUser();
 if(error||!user){showLogin();return}
 const {data:membership,error:memberError}=await sb.from('team_members').select('role').eq('user_id',user.id).maybeSingle();
 if(memberError||!membership){await sb.auth.signOut();showLogin('This email is not authorized for the S’CLINIC CRM.');return}
 activeUser=user;
 document.getElementById('loginOverlay').style.display='none';
 document.getElementById('crmShell').style.display='flex';
 document.getElementById('accountLabel').textContent=user.email+' ('+membership.role+')';
 await loadCloud();
 if(cloudChannel)await sb.removeChannel(cloudChannel);
 cloudChannel=sb.channel('crm-leads-sync').on('postgres_changes',{event:'*',schema:'public',table:'leads'},()=>{
  if(!savePending)scheduleCloudRefresh();
 }).subscribe();
 // Fallback refresh covers projects without Realtime publication enabled.
 window.addEventListener('focus',()=>{if(activeUser&&!savePending)loadCloud()});
}
function showLogin(message=''){
 activeUser=null;cloudReady=false;leads=[];
 document.getElementById('crmShell').style.display='none';
 document.getElementById('loginOverlay').style.display='flex';
 document.getElementById('loginMessage').textContent=message;
}
async function loginCRM(e){
 e.preventDefault();
 const btn=document.getElementById('loginSubmit'),msg=document.getElementById('loginMessage');

function leadDate(x){return x.trackerData?.['Date Received']||x.leadDate||x.created||''}
function dateSortValue(value){
 if(value===null||value===undefined||value==='')return 0;
 if(typeof value==='number'&&value>20000&&value<80000)return Date.UTC(1899,11,30)+value*86400000;
 const raw=String(value).trim();
 let m=raw.match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})/);
 if(m)return Date.UTC(Number(m[1]),Number(m[2])-1,Number(m[3]));
 m=raw.match(/^(\d{1,2})[/-](\d{1,2})[/-](\d{4})$/);
 if(m)return Date.UTC(Number(m[3]),Number(m[2])-1,Number(m[1]));
 const parsed=Date.parse(raw);
 return Number.isNaN(parsed)?0:parsed;
}

let attendedView='booked';
const CONSULTATION_STAGES=['Not Yet Attended','Follow Up','Waiting to Book','Interested Book First Session','Converted','Lost'];
function attendedClient(x){
 const t=x.trackerData||{};
 const outcome=String(t['Consultation Outcome']||'').trim().toLowerCase();
 return x.status==='Attended'||x.status==='Converted'||outcome==='attended'||
   (!!x.consultationStage&&x.consultationStage!=='Not Yet Attended');
}
function attendedStage(x){
 return CONSULTATION_STAGES.includes(x.consultationStage)?x.consultationStage:
   x.status==='Converted'?'Converted':attendedClient(x)?'Follow Up':'Not Yet Attended';
}
function filterAttendedStage(stage){attendedView=stage;renderAttendedConsultations()}
async function updateAttendedStage(id,stage){
 if(!CONSULTATION_STAGES.includes(stage))return;
 const x=leads.find(item=>item.id===id);if(!x)return;
 const previous=x.consultationStage;
 x.consultationStage=stage;
 const select=document.getElementById('attended-'+id);
 if(select){select.disabled=true;select.dataset.stage=stage;}
 try{
  await saveCloudLead(x);
  renderAttendedConsultations();
 }catch(err){
  x.consultationStage=previous;
  renderAttendedConsultations();
  alert('Could not save consultation status. Please try again.');
 }
}

 const shown=attendedView==='booked'?booked:attendedView==='noShows'?noShows:attendedView==='all'?all:filtered.filter(x=>attendedStage(x)===attendedView);
 const buttons=tabs.map(([key,label,count])=>`<button type="button" class="consult-stage-tab" data-stage="${esc(key)}" aria-pressed="${attendedView===key}" onclick="filterAttendedStage('${key}')">${esc(label)} (${count})</button>`).join('');
 const rows=shown.map(x=>{
  const statusCell=`<select class="field consult-stage-select" data-stage="${esc(attendedStage(x))}" style="min-width:185px" id="attended-${esc(x.id)}" onchange="updateAttendedStage('${esc(x.id)}',this.value)">${CONSULTATION_STAGES.map(stage=>`<option value="${stage}" ${attendedStage(x)===stage?'selected':''}>${stage}</option>`).join('')}</select>`;
  return `<tr><td><strong>${esc([x.firstName,x.lastName].filter(Boolean).join(' ')||x.trackerData?.['Lead Name']||'Unnamed')}</strong></td><td>${esc(x.phone||'—')}</td><td>${esc(displayDate(x.trackerData?.['Booking Date']||''))}</td><td>${esc(displayDate(x.consultDate||x.trackerData?.['Consultation Date']))}</td><td>${esc(x.trackerData?.['Consultation Outcome']||x.status||'—')}</td><td>${statusCell}</td><td><button type="button" class="btn small" onclick="editLead('${esc(x.id)}')">View / Edit</button></td></tr>`;
 }).join('');
 app.innerHTML=pageHead('Attended Consultations','All booked clients, attendance, no-shows, and post-consultation follow-ups in one place.')+
 consultationRangeControls()+`<div class="panel"><div class="panelhead"><h2>Consultation overview</h2></div><div style="padding:14px 18px;display:flex;gap:8px;flex-wrap:wrap">${buttons}</div><div class="tablewrap"><table><thead><tr><th>Client</th><th>Phone</th><th>Booking date</th><th>Consultation date</th><th>Outcome / lead status</th><th>Post-consultation stage</th><th>Action</th></tr></thead><tbody>${rows||'<tr><td colspan="7">No clients in this view.</td></tr>'}</tbody></table></div></div>`;
}

const TD=(x,k)=>String((x.trackerData&&x.trackerData[k])||'').trim();
const DAYMS=86400000;
const REP_ROWS=['Meta','LinkedIn','Google / Walk-in','Sleeping leads, but managed to book'];
function repGroup(x){
 const raw=TD(x,'Lead Source').toLowerCase(),fc=TD(x,'First Contact Date'),dr=leadDate(x);
 if(x.sleeping||(fc&&dr&&dateSortValue(dr)-dateSortValue(fc)>=14*DAYMS))return 3;
 if(raw==='linkedin'||x.source==='LinkedIn')return 1;
 if(/walk|google/.test(raw))return 2;
 return 0;
}
function repFlags(x){
 const st=x.status,cs=TD(x,'Contact Status'),oc=TD(x,'Consultation Outcome');
 const reason=TD(x,'Reason Not Proceeding'),notes=((x.notes||'')+' '+reason).toLowerCase();
 const converted=st==='Converted'||TD(x,'Sale Converted').toLowerCase()==='yes';
 const attended=converted||st==='Attended'||oc==='Attended';
 const noShow=st==='No-show'||oc==='No-show';
 const booked=attended||noShow||st==='Booked'||!!TD(x,'Booking Date')||oc==='Rescheduled';
 const historicalNoResponse=Array.isArray(x.statusHistory)&&x.statusHistory.some(h=>h.from==='No response'&&h.to==='Lost');
 const noAnswer=cs==='No Answer'||st==='No response'||st==='Called No Answer'||historicalNoResponse;
 // Count unique leads with recorded outreach, not call attempts or answered calls.
 const called=['Contacted','No Answer','Answered'].includes(cs)||['Called','Called No Answer','No response'].includes(st)||historicalNoResponse;
 const notCalledOrUnconfirmed=!called;
 const notInt=reason==='Not Interested'||/not interested/.test(notes);
 const answered=cs==='Answered'||(!noAnswer&&['Interested','Follow-up','Follow-up Required','Booked','Attended','No-show','Converted'].includes(st));
 return{called,notCalledOrUnconfirmed,noAnswer,answered,booked,attended,noShow,converted,notInt,pending:booked&&!attended&&!noShow,
  engaged:answered&&!booked&&!notInt&&st!=='Lost'};
}
function reportData(){
 const a=dateSortValue(document.getElementById('reportFrom').value),b=dateSortValue(document.getElementById('reportTo').value);
 return leads.filter(l=>{const d=dateSortValue(leadDate(l));return d&&d>=a&&d<=b});
}
function generateReport(){
 const el=document.getElementById('reportResults');
 const from=document.getElementById('reportFrom').value,to=document.getElementById('reportTo').value;
 const by=document.getElementById('reportBy').value.trim();
 if(!from||!to){el.innerHTML='<div class="notice">Please choose both the From date and the To date, then click Generate report.</div>';return}
 if(dateSortValue(from)>dateSortValue(to)){el.innerHTML='<div class="notice">The From date must be earlier than or the same as the To date.</div>';return}
 const g=[[],[],[],[]];
 reportData().forEach(x=>{const grp=repGroup(x);g[grp].push({...repFlags(x),grp})});
 const ag=l=>{const n=k=>l.filter(f=>f[k]).length;return[l.length,n('called'),n('notCalledOrUnconfirmed'),n('booked'),n('attended'),n('noShow'),n('converted'),n('notInt'),n('pending'),n('noAnswer'),n('answered')]};
 const all=[].concat(...g),t=ag(all),per=g.map(ag);
 const pct=(a,b)=>b?(Math.round(a/b*1000)/10).toFixed(1):'0.0';
 const callBook=all.filter(f=>f.booked&&f.called).length;
 const engaged=all.filter(f=>f.engaged).length;
 const best=per.map((v,i)=>({i,v})).filter(o=>o.v[0]>0).sort((p,q)=>q.v[6]-p.v[6]||q.v[3]-p.v[3])[0];
 const nm=['Meta','LinkedIn','Google / Walk-in','Sleeping leads'];
 const learn=best?`${nm[best.i]} worked best: ${best.v[3]} bookings from ${best.v[0]} leads, ${best.v[4]} attended and ${best.v[6]} clients.`:'';
 const prio=`Follow up the ${engaged} engaged active leads and confirm the ${t[8]} booked leads who have not yet attended. Lost leads are excluded from active follow-ups.`;
 const H=['Lead source','Total leads','Calls / outreach recorded','Not called / unconfirmed','Booked','Attended','No-show','Converted','Not interested','Booked, not yet attended','No answer recorded','Answered / engaged'];
 const row=(n,v,c)=>`<tr class="${c||''}"><td>${n}</td>${v.map(z=>`<td>${z}</td>`).join('')}</tr>`;
 const rates=[['Booking rate','Booked / New leads',pct(t[3],t[0])],['Attendance rate','Attended / Booked',pct(t[4],t[3])],['No-show rate','No-show / Booked',pct(t[5],t[3])],['Lead-to-client conversion','Converted / Attended',pct(t[6],t[4])],['Outreach-to-booking rate','Bookings with outreach / Leads with outreach',pct(callBook,t[1])]];
 el.innerHTML=`<div class="wr">
 <h1>S’CLINIC | WEEKLY LEAD PERFORMANCE</h1>
 <p class="wmeta">Reporting week: <b>${displayDate(from)} – ${displayDate(to)}</b> &nbsp;&nbsp; Prepared by: <b>${esc(by)||'__________'}</b></p>
 <h3>1. Lead funnel by source</h3><div class="tablewrap"><table><thead><tr>${H.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>
 ${per.map((v,i)=>row(REP_ROWS[i],v,i===3?'yel':'')).join('')}${row('TOTAL',t,'tot')}</tbody></table></div>
 <p class="wnote">Calls / outreach recorded = unique leads with a recorded contact status or calling stage (not necessarily answered calls). Not called / unconfirmed = Total leads minus recorded outreach. These two categories always sum to Total leads. No answer recorded is a separate overlapping measure that includes historical no-response leads moved to Lost. Answered / engaged is based on explicit engagement, not proof of a phone call being answered.</p>
 <h3>2. Key conversion rates</h3><table><thead><tr><th>Metric</th><th>Calculation</th><th>Result</th></tr></thead><tbody>${rates.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]} %</td></tr>`).join('')}</tbody></table>
 <h3>3. Phone outreach &amp; next-week follow-up</h3><table><thead><tr><th>Calls / outreach recorded</th><th>No answer recorded</th><th>Active engaged leads to follow up</th></tr></thead><tbody><tr><td>${t[1]}</td><td>${t[9]}</td><td>${engaged} engaged</td></tr></tbody></table>
 <p class="wnote">Count unique leads, not repeat attempts. A call with no answer can be counted in both outreach recorded and no answer recorded; only the first two funnel categories reconcile to total leads. Lost leads are excluded from active follow-up suggestions.</p>
 <h3>4. Weekly learning &amp; next action</h3><label class="wl">What worked best this week?</label><textarea class="wt">${esc(learn)}</textarea>
 <label class="wl">What is the single priority for next week?</label><textarea class="wt">${esc(prio)}</textarea>
 ${all.length?'':'<div class="notice noprint">No leads have a Lead date inside this period.</div>'}</div>`;
}

function perfDate(x,key,fallback=''){return dateSortValue(TD(x,key)||fallback)}
function perfInMonth(value,month){const d=dateSortValue(value);return d>=dateSortValue(month+'-01')&&d<dateSortValue(nextPerfMonth(month)+'-01')}
function nextPerfMonth(month){const [y,m]=month.split('-').map(Number);return m===12?(y+1)+'-01':y+'-'+String(m+1).padStart(2,'0')}
function perfOutcome(x){return TD(x,'Consultation Outcome').toLowerCase()}
function perfBooked(x){return !!TD(x,'Booking Date')}
function perfAttended(x){return perfOutcome(x)==='attended'}
function perfConverted(x){return TD(x,'Sale Converted').toLowerCase()==='yes'}
function perfMoney(x){const v=String(TD(x,'Sale Value (AED)')||'').replace(/[^0-9.-]/g,'');return Number(v)||0}
function perfSaleDate(x){return TD(x,'Sale Date')||(perfConverted(x)?TD(x,'Date Received'):'')}
function perfSource(x){const raw=String(TD(x,'Lead Source')||x.source||'Other').trim();return raw||'Other'}
function perfRange(value){const d=dateSortValue(value),a=dateSortValue(document.getElementById('performanceFrom')?.value),b=dateSortValue(document.getElementById('performanceTo')?.value);return !!(d&&a&&b&&d>=a&&d<=b)}
function renderReports(){
 const today=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Dubai',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
 const first=today.slice(0,7)+'-01';
 const last=new Date(Date.UTC(Number(today.slice(0,4)),Number(today.slice(5,7)),0)).toISOString().slice(0,10);
 app.innerHTML=pageHead('Performance','Date-filtered Lead Tracker results. Dashboard may show a different total if its date filters differ.',`<button type="button" class="btn" onclick="exportCSV()">Export CSV</button>`)+
 `<div class="panel"><div class="panelhead"><h2>Filter dates</h2><div style="display:flex;gap:12px;flex-wrap:wrap"><label>From <input type="date" class="field" id="performanceFrom" value="${first}" onchange="performanceSelection=null;updatePerformance()"></label><label>To <input type="date" class="field" id="performanceTo" value="${last}" onchange="performanceSelection=null;updatePerformance()"></label></div></div><div id="performanceResults"></div></div>`;
 updatePerformance();
}
let performanceSelection=null;
function choosePerformance(kind,source=''){
 performanceSelection={kind,source};
 showPerformanceDetails();
}
function showPerformanceDetails(){
 const el=document.getElementById('performanceDetails');
 if(!el||!performanceSelection)return;
 const {kind,source}=performanceSelection;
 const cohort=leads.filter(x=>perfRange(TD(x,'Date Received')));
 const scheduled=leads.filter(x=>perfRange(TD(x,'Consultation Date')));
 const closed=leads.filter(x=>perfRange(perfSaleDate(x))&&perfConverted(x));
 const reactivated=leads.filter(x=>perfRange(TD(x,'Last Contact Date'))&&dateSortValue(TD(x,'Date Received'))>0&&dateSortValue(TD(x,'Date Received'))<dateSortValue(document.getElementById('performanceFrom').value));
 const salesValue=leads.filter(x=>perfRange(perfSaleDate(x))&&perfMoney(x)!==0);
 const groups={undatedSales:leads.filter(x=>perfMoney(x)>0&&!dateSortValue(perfSaleDate(x))),saleCohort:cohort.filter(perfConverted),salesValue,all:leads.filter(x=>!!dateSortValue(TD(x,'Date Received'))),reactivated,activity:leads.filter(x=>perfRange(TD(x,'Last Contact Date'))||perfRange(TD(x,'Consultation Date'))||perfRange(perfSaleDate(x))),leads:cohort,booked:cohort.filter(perfBooked),attended:cohort.filter(perfAttended),converted:closed,scheduled,actualAttended:scheduled.filter(perfAttended),noShows:scheduled.filter(x=>perfOutcome(x)==='no-show'||x.status==='No-show'),closed};
 const aliases={cohortValue:'salesValue',bookingRate:'booked',saleRate:'saleCohort',attendanceRate:'actualAttended',closedValue:'closed'};
 const items=(groups[aliases[kind]||kind]||[]).filter(x=>!source||perfSource(x)===source);
 const titles={undatedSales:'Sales missing Sale Date — needs review',all:'Leads with Date Received',reactivated:'Older leads contacted this period',activity:'Leads active this period',leads:'Leads received',booked:'Consultations booked',attended:'Consultations attended (cohort)',converted:'Sales converted',cohortValue:'Total sales value',bookingRate:'Booking rate',saleRate:'Lead-to-sale rate',scheduled:'Consultations scheduled',actualAttended:'Consultations attended',noShows:'No-shows',attendanceRate:'Attendance rate',closed:'Sales closed',closedValue:'Sales value closed'};
 el.innerHTML='<div class="panelhead"><h2>'+esc(titles[kind]||'Performance')+(source?' — '+esc(source):'')+' ('+items.length+')</h2><button type="button" class="btn small" onclick="performanceSelection=null;document.getElementById(&quot;performanceDetails&quot;).innerHTML=&quot;&quot;">Close</button></div>'+(items.length?table(items):'<div class="empty">No matching clients.</div>');
 el.scrollIntoView({behavior:'smooth',block:'start'});
}

function updatePerformance(){
 const from=document.getElementById('performanceFrom')?.value,to=document.getElementById('performanceTo')?.value;
 if(!from||!to||dateSortValue(from)>dateSortValue(to)){document.getElementById('performanceResults').innerHTML='<div class="notice">Select a valid From and To date.</div>';return}
 const cohort=leads.filter(x=>perfRange(TD(x,'Date Received')));
 const totalLeads=leads.filter(x=>!!dateSortValue(TD(x,'Date Received'))).length;
 const undatedSales=leads.filter(x=>perfMoney(x)>0&&!dateSortValue(perfSaleDate(x)));
 const reactivated=leads.filter(x=>perfRange(TD(x,'Last Contact Date'))&&dateSortValue(TD(x,'Date Received'))>0&&dateSortValue(TD(x,'Date Received'))<dateSortValue(from));
 const activity=leads.filter(x=>perfRange(TD(x,'Last Contact Date'))||perfRange(TD(x,'Consultation Date'))||perfRange(perfSaleDate(x)));
 const scheduled=leads.filter(x=>perfRange(TD(x,'Consultation Date')));
 const closed=leads.filter(x=>perfRange(perfSaleDate(x))&&perfConverted(x));
 const booked=cohort.filter(perfBooked),attended=cohort.filter(perfAttended),converted=cohort.filter(perfConverted);
 const actualAttended=scheduled.filter(perfAttended),noShows=scheduled.filter(x=>perfOutcome(x)==='no-show');
 const percent=(n,d)=>d?(100*n/d).toFixed(1)+'%':'0.0%';
 const tile=(name,value,detail,kind)=>`<div class="stat" role="button" tabindex="0" style="cursor:pointer" onclick="choosePerformance(&quot;${kind}&quot;)" onkeydown="if(event.key===&quot;Enter&quot;||event.key===&quot; &quot;){event.preventDefault();choosePerformance(&quot;${kind}&quot;)}" title="Click to see matching clients"><label>${name}</label><strong>${value}</strong><small>${detail} · View clients →</small></div>`;
 const tiles=[
 ['Leads with Date Received',totalLeads,'All dated leads; excludes records missing Date Received','all'],
 ['Older leads contacted this period',reactivated.length,'Received before From date; last contact in range','reactivated'],
 ['Leads active this period',activity.length,'Contact, consultation, or sale date in range','activity'],
 ['Leads received',cohort.length,'Lead received date', 'leads'],
 ['Consultations booked (cohort)',booked.length,'Leads received this month', 'booked'],
 ['Consultations attended (cohort)',attended.length,'Leads received this month', 'attended'],
 ['Sales converted',closed.length,'Sale Date, or Date Received if converted and Sale Date is blank', 'converted'],
 ['Total sales value',money(leads.filter(x=>perfRange(perfSaleDate(x))).reduce((s,x)=>s+perfMoney(x),0)),'AED · includes older leads and converted sales without a Sale Date', 'cohortValue'],
 ['Sales missing Sale Date',undatedSales.length,'Review undated amounts before assigning them to a month', 'undatedSales'],
 ['Booking rate',percent(booked.length,cohort.length),'Booked / leads received', 'bookingRate'],
 ['Lead-to-sale rate (cohort)',percent(cohort.filter(perfConverted).length,cohort.length),'Converted leads from received cohort / leads received', 'saleRate'],
 ['Consultations scheduled',scheduled.length,'Consultation date in month', 'scheduled'],
 ['Consultations attended',actualAttended.length,'Consultation date in month', 'actualAttended'],
 ['No-shows',noShows.length,'Consultation date in month', 'noShows'],
 ['Attendance rate',percent(actualAttended.length,scheduled.length),'Attended / scheduled', 'attendanceRate'],
 ];
 const sources=[...new Set(leads.map(perfSource))].sort((a,b)=>a.localeCompare(b));
 const rows=sources.map(source=>{
 const group=leads.filter(x=>perfSource(x)===source);
 const b=group.filter(perfBooked).length,a=group.filter(perfAttended).length,cv=group.filter(perfConverted);
 return `<tr style="cursor:pointer" title="Click to view source leads" onclick="choosePerformance(&quot;all&quot;,decodeURIComponent(&quot;${encodeURIComponent(source)}&quot;))"><td>${esc(source)} ↗</td><td>${group.length}</td><td>${b}</td><td>${a}</td><td>${cv.length}</td><td>${money(group.reduce((s,x)=>s+perfMoney(x),0))}</td></tr>`;
 }).join('');
 document.getElementById('performanceResults').innerHTML=`<p style="padding:12px 18px;margin:0;color:var(--muted)"><strong>${cohort.length} leads received in selected dates</strong> out of ${totalLeads} total CRM records. All historical leads are included below; period activity includes older leads.</p><div class="stats" style="padding:16px">${tiles.map(t=>tile(...t)).join('')}</div>
 <div class="panelhead"><h2>Lead source performance — all historical leads</h2></div>
 <div class="tablewrap"><table><thead><tr><th>Lead source</th><th>Leads</th><th>Booked</th><th>Attended</th><th>Converted</th><th>Sales value (AED)</th></tr></thead><tbody>${rows||'<tr><td colspan="6">No leads found.</td></tr>'}</tbody></table></div><div id="performanceDetails"></div>
 <p class="followup-filter-note" style="padding:12px 18px">Based on the CRM copy of Lead Tracker fields. All CRM leads and source totals include historical leads. New-lead cohort metrics follow Date Received; reactivation uses Last Contact Date; appointments use Consultation Date. Sales converted and Total sales value include older and newer leads using Sale Date; for converted leads with a blank Sale Date, Date Received is treated as the closing date. Other sales missing both dates remain separately flagged. Source records are unchanged. Advertising spend is not included because it is maintained separately in the Advertising Spend tab. Changes in Google Sheets appear after synchronization.</p>`;
 if(performanceSelection)showPerformanceDetails();
}
function renderSettings(){app.innerHTML=pageHead('Settings','CRM details and local data management.')+`<div class="panel"><h2>Clinic details</h2><div class="quicklist" style="margin-top:14px"><div class="quickrow"><span>Clinic</span><strong>S’CLINIC</strong></div><div class="quickrow"><span>WhatsApp Business number</span><strong>+971 58 676 7298</strong></div><div class="quickrow"><span>Account setup</span><strong>Shared staff access</strong></div><div class="quickrow"><span>Lead sources</span><strong>Instagram · Facebook · NA · LinkedIn</strong></div><div class="quickrow"><span>Platform</span><strong>Supabase cloud / browser-based</strong></div></div><div class="notice"><strong>WhatsApp connection status: Not connected.</strong><br>This standalone HTML file can open a WhatsApp chat using the saved number, but it cannot automatically receive WhatsApp messages or sync chats. Automated lead capture requires a secure server and an approved Meta WhatsApp Business Platform integration.</div></div><div class="panel"><h2>Data backup</h2><p style="color:var(--muted)">Your leads are saved to your secure shared Supabase database when you edit them. Download a JSON backup periodically for disaster recovery.</p><button class="btn" onclick="exportCSV()">Download lead register (CSV)</button> <button class="btn" onclick="backupJSON()">Download backup (JSON)</button> <div class="notice">Important: HTML-only storage is not cloud storage. Records are stored in the shared cloud database. Refresh to see changes from another device. Export backups regularly. Do not store medical records, scalp photos or sensitive clinical information in this prototype.</div></div>`}
function openModal(id=''){document.getElementById('leadForm').reset();document.getElementById('editId').value='';document.getElementById('modalTitle').textContent=id?'Edit lead':'Add new lead';document.getElementById('leadDateInput').value=today();if(id){let x=leads.find(l=>l.id===id);if(!x)return;document.getElementById('editId').value=x.id;['firstName','lastName','phone','source','status','followDate','consultDate','value','notes'].forEach(k=>document.getElementById(k).value=x[k]??'');document.getElementById('leadDateInput').value=leadDate(x)}document.getElementById('leadModal').classList.add('show')}
function closeModal(){document.getElementById('leadModal').classList.remove('show')}
function editLead(id){openModal(id)}
document.getElementById('leadForm').addEventListener('submit',async e=>{e.preventDefault();let id=document.getElementById('editId').value,phone=document.getElementById('phone').value.trim();let duplicate=leads.find(x=>x.phone.replace(/\D/g,'')===phone.replace(/\D/g,'')&&x.id!==id);if(duplicate&&!confirm('A lead with this phone number already exists. Save another record anyway?'))return;let previous=id?leads.find(l=>l.id===id):null;let trackerData={...(previous?.trackerData||{}),'Date Received':document.getElementById('leadDateInput').value,'Next Follow-up Date':document.getElementById('followDate').value,'Consultation Date':document.getElementById('consultDate').value,'Notes':document.getElementById('notes').value,'Lead Source':document.getElementById('source').value,'Sale Value (AED)':document.getElementById('value').value};
 const newStatus=document.getElementById('status').value;
 trackerData['CRM Status']=newStatus;
 if(newStatus==='Converted'){trackerData['Sale Converted']='Yes';trackerData['Lead Status']='Converted';}
 else {trackerData['Sale Converted']='';trackerData['Lead Status']=newStatus==='Lost'?'Not Proceeding':newStatus==='Interested'||newStatus==='Follow-up Required'?'Follow-up Required':newStatus==='No response'||newStatus==='Called No Answer'?'Contact Attempted':newStatus;}
let x={id:id||('L'+Date.now()),firstName:document.getElementById('firstName').value.trim(),lastName:document.getElementById('lastName').value.trim(),phone,source:document.getElementById('source').value,status:document.getElementById('status').value,followDate:document.getElementById('followDate').value,consultDate:document.getElementById('consultDate').value,value:document.getElementById('value').value,notes:document.getElementById('notes').value,created:previous?previous.created:today(),trackerData};if(id)leads=leads.map(l=>l.id===id?x:l);else leads.push(x);savePending=true;
 try{await saveCloudLead(x);closeModal();render();}catch(err){await loadCloud();alert('Lead was not saved: '+err.message)}finally{savePending=false;}
});
function whatsapp(phone){let raw=decodeURIComponent(phone).replace(/\D/g,'');window.open('https://wa.me/'+raw,'_blank','noopener')}
function exportCSV(){let cols=['firstName','lastName','phone','source','status','followDate','consultDate','value','notes','leadDate','created'];let rows=[cols.join(','),...leads.map(x=>cols.map(k=>'"'+String(k==='leadDate'?leadDate(x):(x[k]??'')).replace(/"/g,'""')+'"').join(','))];download('sclinic-leads.csv',rows.join('\n'),'text/csv')}
function backupJSON(automatic=false){
 const stamp=new Date().toISOString().replace(/[:.]/g,'-');
 download('sclinic-crm-backup-'+stamp+'.json',JSON.stringify(leads,null,2),'application/json');
}
function restoreJSON(){alert('To import another backup into the shared CRM, contact your administrator. This prevents accidental overwrites.')}
function download(name,data,type){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([data],{type}));a.href=u;a.download=name;a.click();URL.revokeObjectURL(u)}
setupCloud();
</script>
